<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMD v1.02</title>
    <style>
        /* Ваши стили */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #e74c3c;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin-top: 20px;
        }
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .buttons button {
            background-color: #e9e9e9;
            color: #2c3e50;
            border: 2px solid #95a5a6;
            border-radius: 25px;
            padding: 15px 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .buttons button:hover {
            background-color: #95a5a6;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }
        .buttons button:active {
            background-color: #7f8c8d;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .media-container {
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            width: 100%;
            max-width: 1500px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            height: 500px;
            background-color: #e3e3e3;
            border-radius: 15px;
            overflow: hidden;
        }
        .video-container img, .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-message {
            font-size: 18px;
            color: #555;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>EMD v1.02</header>

<div class="container">
    <div class="form-container">
        <div class="buttons">
            <button onclick="startCamera()">Открыть камеру</button>
            <form id="fileForm" action="/process_video" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" style="margin-bottom: 20px;">
                <button type="submit">Обработать файл</button>
            </form>
            <button onclick="stopSession()">Завершить сеанс</button>
        </div>
    </div>

    <div class="media-container">
        <!-- Область для видео с камеры -->
        <div class="video-container">
            <img id="video_stream" src="" alt="Video Stream" style="display: none;" />
        </div>

        <!-- Область для обработанного видео -->
        <div class="video-container" id="processedContainer" style="display: none;">
            <video id="processed_video" controls></video>
        </div>
    </div>

    <div class="status-message" id="statusMessage">Подождите, идет обработка...</div> <!-- Сообщение для обработки -->
</div>

<script>
    // Функция для запуска камеры
    function startCamera() {
        let videoElement = document.getElementById('video_stream');
        videoElement.style.display = 'block';  // Показываем <img> для потока
        videoElement.src = "/start_camera";    // Устанавливаем источник потока
    }

    // Функция для остановки камеры
    function stopSession() {
        // Отправка POST запроса на сервер для завершения сессии
        fetch('/stop_session', {
            method: 'POST'
        })
        .then(response => {
            if (response.ok) {

                // Останавливаем видео поток
                let videoElement = document.getElementById('video_stream');
                videoElement.src = "";  // Очищаем источник видео
                videoElement.style.display = 'none';  // Скрываем элемент видео
    
                // Останавливаем обработанное видео (если оно есть)
                let processedContainer = document.getElementById('processedContainer');
                processedContainer.style.display = 'none';  // Скрываем контейнер обработанного видео
            } else {
                console.log("Ошибка при завершении сессии.");
            }
        })
        .catch(error => {
            console.log("Ошибка сети:", error);
        });
    }

    // Обработчик отправки формы для обработки видео
    document.getElementById('fileForm').addEventListener('submit', function(event) {
        event.preventDefault();  // Отменить стандартное отправление формы
        let statusMessage = document.getElementById('statusMessage');
        let processedContainer = document.getElementById('processedContainer');
        statusMessage.style.display = 'block'; // Показываем сообщение о процессе

        // Скрываем видео с камеры
        let videoElement = document.getElementById('video_stream');
        videoElement.style.display = 'none';

        // Создаём FormData для отправки файла
        let formData = new FormData(this);

        // Отправляем запрос на сервер
        fetch('/process_video', {
            method: 'POST',
            body: formData
        })
        .then(response => response.blob())  // Получаем видео как Blob
        .then(data => {
            // Создаем URL для обработанного видео
            const url = URL.createObjectURL(data);
            const processedVideo = document.getElementById('processed_video');
            processedVideo.src = url;

            // Показываем обработанное видео
            processedContainer.style.display = 'block';

            // Скрываем сообщение о процессе
            statusMessage.style.display = 'none';
        })
        .catch(error => {
            statusMessage.innerText = "Ошибка при обработке файла";
        });
    });
</script>

</body>
</html>
